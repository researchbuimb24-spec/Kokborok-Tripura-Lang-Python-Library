[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tripura-translate"
version = "0.1.0"
description = "A complete, reusable Python library for Kokborok (Tripuri) text processing, dictionary search, and verified translation."
readme = "README.md"
authors = [{ name = "Tripura Translate Contributors" }]
license = { text = "MIT" }
requires-python = ">=3.8"
keywords = [
    "kokborok",
    "tripuri",
    "tripura",
    "nlp",
    "translation",
    "dictionary",
    "indian-languages",
    "language-processing",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = []

[project.optional-dependencies]
models = [
    "transformers>=4.30.0",
    "torch>=2.0.0",
    "sentencepiece",
]
dev = [
    "pytest>=7.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"tripura_translate.data" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
